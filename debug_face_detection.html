<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Face Detection</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #f0f0f0; }
        .container { max-width: 1200px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; }
        video { width: 400px; height: 300px; border: 2px solid #ddd; }
        canvas { width: 400px; height: 300px; border: 2px solid red; margin-left: 20px; }
        .status { margin: 20px 0; padding: 15px; border-radius: 8px; font-weight: bold; font-size: 18px; }
        .good { background: #d4edda; color: #155724; }
        .warning { background: #fff3cd; color: #856404; }
        .error { background: #f8d7da; color: #721c24; }
        button { padding: 12px 24px; margin: 8px; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; }
        .btn-primary { background: #007bff; color: white; }
        .btn-danger { background: #dc3545; color: white; }
        .metrics { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin: 20px 0; }
        .metric { background: #f8f9fa; padding: 15px; border-radius: 8px; text-align: center; }
        .log { background: #000; color: #00ff00; padding: 15px; border-radius: 8px; height: 200px; overflow-y: auto; font-family: monospace; font-size: 12px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 Debug Face Detection - Step by Step</h1>
        
        <div>
            <button id="startBtn" class="btn-primary">📹 Start Camera</button>
            <button id="detectBtn" class="btn-primary" disabled>🔍 Run Detection</button>
            <button id="stopBtn" class="btn-danger" disabled>⏹️ Stop</button>
        </div>
        
        <div style="display: flex; margin: 20px 0;">
            <video id="video" autoplay muted playsinline></video>
            <canvas id="canvas"></canvas>
        </div>
        
        <div id="status" class="status">Click "Start Camera" to begin debugging</div>
        
        <div class="metrics">
            <div class="metric">
                <div style="font-size: 24px; color: #007bff;" id="faceCount">0</div>
                <div>Faces Detected</div>
            </div>
            <div class="metric">
                <div style="font-size: 24px; color: #28a745;" id="confidence">0%</div>
                <div>Confidence</div>
            </div>
            <div class="metric">
                <div style="font-size: 24px; color: #ffc107;" id="skinPercent">0%</div>
                <div>Skin Pixels</div>
            </div>
            <div class="metric">
                <div style="font-size: 24px; color: #6c757d;" id="totalPixels">0</div>
                <div>Total Pixels</div>
            </div>
        </div>
        
        <div class="log" id="log">
            <div style="color: #ffff00;">🔍 Face Detection Debug Console</div>
            <div>Ready to start debugging...</div>
        </div>
    </div>

    <script>
        let video, canvas, ctx;
        let stream = null;

        document.addEventListener('DOMContentLoaded', () => {
            video = document.getElementById('video');
            canvas = document.getElementById('canvas');
            ctx = canvas.getContext('2d');
            
            document.getElementById('startBtn').addEventListener('click', startCamera);
            document.getElementById('detectBtn').addEventListener('click', runDetection);
            document.getElementById('stopBtn').addEventListener('click', stop);
        });

        async function startCamera() {
            try {
                updateStatus('Starting camera...', 'warning');
                log('🔄 Requesting camera access...');
                
                stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { 
                        width: { ideal: 640 },
                        height: { ideal: 480 },
                        facingMode: 'user'
                    } 
                });
                
                video.srcObject = stream;
                
                video.onloadedmetadata = () => {
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    
                    updateStatus('Camera ready! Click "Run Detection" to test', 'good');
                    log(`✅ Camera started - Resolution: ${video.videoWidth}x${video.videoHeight}`);
                    
                    document.getElementById('startBtn').disabled = true;
                    document.getElementById('detectBtn').disabled = false;
                    document.getElementById('stopBtn').disabled = false;
                };
                
            } catch (error) {
                updateStatus(`Camera error: ${error.message}`, 'error');
                log(`❌ Camera error: ${error.message}`);
            }
        }

        function runDetection() {
            if (!video || video.videoWidth === 0) {
                log('❌ Video not ready');
                return;
            }
            
            log('🔍 Running face detection...');
            
            try {
                // Step 1: Draw video to canvas
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                log('✅ Step 1: Video frame captured to canvas');
                
                // Step 2: Get image data
                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                log(`✅ Step 2: Image data extracted - ${imageData.data.length} bytes`);
                
                // Step 3: Analyze pixels
                const result = analyzePixels(imageData, canvas.width, canvas.height);
                log(`✅ Step 3: Pixel analysis complete`);
                
                // Step 4: Update UI
                document.getElementById('faceCount').textContent = result.faceCount;
                document.getElementById('confidence').textContent = Math.round(result.confidence * 100) + '%';
                document.getElementById('skinPercent').textContent = result.skinPercentage.toFixed(1) + '%';
                document.getElementById('totalPixels').textContent = result.totalPixels.toLocaleString();
                
                // Step 5: Update status
                if (result.faceCount === 1) {
                    updateStatus(`✅ Single face detected (${Math.round(result.confidence * 100)}% confidence)`, 'good');
                } else if (result.faceCount > 1) {
                    updateStatus(`⚠️ Multiple faces detected (${result.faceCount})`, 'warning');
                } else {
                    updateStatus('❌ No face detected', 'error');
                }
                
                log(`📊 Results: ${result.faceCount} faces, ${result.skinPercentage.toFixed(1)}% skin, ${Math.round(result.confidence * 100)}% confidence`);
                
            } catch (error) {
                log(`❌ Detection error: ${error.message}`);
                updateStatus(`Detection error: ${error.message}`, 'error');
            }
        }

        function analyzePixels(imageData, width, height) {
            const data = imageData.data;
            let skinPixels = 0;
            let totalPixels = 0;
            let sampleCount = 0;
            
            log('🔬 Starting pixel analysis...');
            
            // Sample every 8th pixel for performance
            for (let i = 0; i < data.length; i += 32) { // RGBA = 4 bytes, so 32 = 8 pixels
                const r = data[i];
                const g = data[i + 1];
                const b = data[i + 2];
                
                totalPixels++;
                sampleCount++;
                
                if (isSkinColor(r, g, b)) {
                    skinPixels++;
                }
                
                // Log first few pixels for debugging
                if (sampleCount <= 5) {
                    log(`Pixel ${sampleCount}: RGB(${r},${g},${b}) - Skin: ${isSkinColor(r, g, b)}`);
                }
            }
            
            const skinPercentage = totalPixels > 0 ? (skinPixels / totalPixels) * 100 : 0;
            
            log(`📊 Pixel Analysis: ${skinPixels}/${totalPixels} skin pixels = ${skinPercentage.toFixed(1)}%`);
            
            // Face detection logic
            let faceCount = 0;
            let confidence = 0;
            
            if (skinPercentage > 1 && skinPercentage < 12) {
                faceCount = 1;
                confidence = Math.min(0.9, skinPercentage / 8);
                log(`🎯 Logic: Single face detected (skin: ${skinPercentage.toFixed(1)}%)`);
            } else if (skinPercentage >= 12 && skinPercentage < 30) {
                faceCount = Math.max(2, Math.floor(skinPercentage / 10));
                confidence = 0.8;
                log(`🎯 Logic: Multiple faces detected (skin: ${skinPercentage.toFixed(1)}%)`);
            } else if (skinPercentage >= 30) {
                faceCount = Math.max(3, Math.floor(skinPercentage / 12));
                confidence = 0.9;
                log(`🎯 Logic: Many faces detected (skin: ${skinPercentage.toFixed(1)}%)`);
            } else {
                faceCount = 0;
                confidence = 0;
                log(`🎯 Logic: No faces detected (skin: ${skinPercentage.toFixed(1)}%)`);
            }
            
            return {
                faceCount,
                confidence,
                skinPercentage,
                totalPixels
            };
        }

        function isSkinColor(r, g, b) {
            // Simple but effective skin detection
            const condition1 = (r > 95 && g > 40 && b > 20) &&
                              (Math.max(r, g, b) - Math.min(r, g, b) > 15) &&
                              (Math.abs(r - g) > 15) && (r > g && r > b);
            
            const condition2 = (r > 50 && r < 250) && (g > 40 && g < 220) && 
                              (b > 20 && b < 200) && (r > b);
            
            return condition1 || condition2;
        }

        function stop() {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                stream = null;
            }
            
            video.srcObject = null;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            updateStatus('Stopped', 'warning');
            log('⏹️ Detection stopped');
            
            document.getElementById('startBtn').disabled = false;
            document.getElementById('detectBtn').disabled = true;
            document.getElementById('stopBtn').disabled = true;
        }

        function updateStatus(message, type) {
            const statusEl = document.getElementById('status');
            statusEl.textContent = message;
            statusEl.className = `status ${type}`;
        }

        function log(message) {
            const logEl = document.getElementById('log');
            const timestamp = new Date().toLocaleTimeString();
            logEl.innerHTML += `<div>[${timestamp}] ${message}</div>`;
            logEl.scrollTop = logEl.scrollHeight;
        }
    </script>
</body>
</html>
